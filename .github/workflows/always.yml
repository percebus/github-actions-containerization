name: "[C]ontinuous [I]ntegration"

on:
  push:
  workflow_dispatch: # Allows you to run this workflow manually from the Actions tab

permissions:
  contents: read

jobs:
  lint:
    uses: percebus/github-actions-npm/.github/workflows/run_script.yml@main
    with:
      script: lint

  codeQL:
    needs: lint
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language:
          - actions
          # - javascript # TODO? or XXX? no js code

    name: CodeQL analyze
    uses: percebus/github-actions-compliance/.github/workflows/codeql_analyze.yml@main
    with:
      language: ${{ matrix.language }}
